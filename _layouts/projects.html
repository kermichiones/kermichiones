---
layout: default
---

<div>
    <div class="section-bar" style="margin-bottom: 25px;">
        <span data-i18n="projects_header">PROJECTS (Projeler)</span>
    </div>

    <div style="padding: 10px 0;">
        <p data-i18n="projects_desc" style="font-style: italic; color: var(--text-muted); margin-bottom: 30px;">Geliştirdiğim bazı oyunlar ve web projeleri:</p>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px;">
            
            {% for project in site.projects %} 
            <div style="background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; box-shadow: 0 2px 8px rgba(61, 49, 46, 0.02); padding: 15px; display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s ease, box-shadow 0.2s ease;" onmouseenter="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 6px 15px rgba(61, 49, 46, 0.05)';" onmouseleave="this.style.transform='none'; this.style.boxShadow='0 2px 8px rgba(61, 49, 46, 0.02)';">
                <!-- Image Area -->
                <div style="background: var(--bg-color); height: 120px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden;">
                    {% if project.image %}
                    <img src="{{ project.image }}" style="width: 100%; height: 100%; object-fit: cover; filter: sepia(15%) contrast(98%); border: none; padding: 0;">
                    {% else %}
                    <span style="font-size: 32px; filter: grayscale(40%);">⚡</span>
                    {% endif %}
                </div>
                
                <!-- Content -->
                <h4 style="margin: 0; font-family: var(--font-header); font-size: 16px; font-weight: 700; color: var(--text-main);">{{ project.title }}</h4>
                <p style="font-size: 13.5px; line-height: 1.5; color: var(--text-muted); margin: 0; flex-grow: 1;">{{ project.description }}</p>
                
                <!-- Button -->
                <a href="{{ project.url }}" class="btn-retro" style="text-align: center; width: 100%; padding: 6px 0;" data-i18n="examine_btn">
                    İNCELE
                </a>
            </div>
            {% endfor %}
            
        </div>
    </div>
</div>
